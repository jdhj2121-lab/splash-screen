<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olihaven - System Logs</title>
    <link rel="icon" type="image/x-icon" href="./favicon-2.ico">
    <link rel="stylesheet" href="./style.css">
    <style>
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .log-container {
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #29292e;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #f4d35e;
            letter-spacing: -0.5px;
        }
        .status-badge {
            background: rgba(4, 211, 97, 0.1);
            color: #04d361;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .terminal-box {
            background: #111112;
            border: 1px solid #29292e;
            border-radius: 6px;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .log-entry {
            margin-bottom: 0.5rem;
            border-left: 2px solid #29292e;
            padding-left: 0.5rem;
        }
        .timestamp {
            color: #7c7c8a;
            margin-right: 0.5rem;
        }
        .tag-info { color: #3a86ff; font-weight: bold; }
        .tag-success { color: #04d361; font-weight: bold; }
        
        /* TWO-BUTTON FLEX LAYOUT MODULE */
        .action-flex-row {
            display: flex;
            gap: 0.75rem;
            width: 100%;
            margin-bottom: 0.75rem;
        }

        .link-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            box-sizing: border-box;
            text-align: center;
        }
        .btn-primary {
            background: #f4d35e;
            color: #110a1c;
            border: none;
        }
        .btn-primary:hover {
            background: #e5c144;
        }
        .btn-secondary {
            background: transparent;
            color: #b3b0c2;
            border: 1px solid #29292e;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: #7c7c8a;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="log-container">
        <div class="log-header">
            <h2>Transmission History</h2>
            <div class="status-badge">Online</div>
        </div>

        <!-- SCROLLABLE TERMINAL LOG READER WITH DYNAMIC TIMESTAMPS -->
        <div class="terminal-box" id="log-screen">
            <div class="log-entry">
                <span class="timestamp running-time">[00:00:00]</span><span class="tag-success">SUCCESS</span> Node link established safely.
            </div>
            <div class="log-entry">
                <span class="timestamp running-time">[00:00:00]</span><span class="tag-info">INFO</span> Interface handshake packet resolved.
            </div>
            <div class="log-entry">
                <span class="timestamp running-time">[00:00:00]</span><span class="tag-info">INFO</span> Route initial sync protocol launched.
            </div>
            <div class="log-entry">
                <span class="timestamp running-time">[00:00:00]</span><span class="tag-success">SUCCESS</span> Client verification token accepted.
            </div>
        </div>

        <!-- TWO-BUTTON INTERACTIVE UTILITY BAR -->
        <div class="action-flex-row">
            <!-- NEW DIRECT CLICK-TO-CALL HOTKEY MODULE -->
            <a href="tel:+16367232298" class="link-btn btn-primary">
                Press here to call 6367232298 📞
            </a>
        </div>

        <!-- RETURN BACK TO ACCESS INTERFACE -->
        <a href="index.html" class="link-btn btn-secondary">
            ← Return to Node Gate
        </a>
    </div>

    <script>
        function updateTimestamps() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timeString = `[${hours}:${minutes}:${seconds}]`;
            
            const elements = document.getElementsByClassName('running-time');
            for (let i = 0; i < elements.length; i++) {
                elements[i].textContent = timeString;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateTimestamps();
            setInterval(updateTimestamps, 1000);
        });
    </script>

</body>
</html>
