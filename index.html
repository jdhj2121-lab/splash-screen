<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olihaven</title>
    <link rel="icon" type="image/x-icon" href="./favicon-2.ico">
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Fallback styling framework to keep elements neatly structured */
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-container {
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 12px;
            padding: 2.5rem;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }
        input[type="password"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid #29292e;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            text-align: center;
            margin-bottom: 1.2rem;
        }
        input[type="password"]:focus {
            border-color: #f4d35e;
        }
        button, .link-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background: #f4d35e;
            color: #110a1c;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            box-sizing: border-box;
            text-align: center;
        }
        button:hover, .link-btn:hover {
            background: #e5c144;
        }
        .link-btn:active {
            transform: scale(0.98);
        }
        #error-message {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        /* Revealed contact/log module styles */
        .reveal-details {
            text-align: center;
            background: rgba(0,0,0,0.2);
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 1.5rem 1rem;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }
        .phone-display {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            margin: 0.5rem 0;
        }

        /* FLEX CONTAINER FOR THREE BUTTONS */
        .action-flex-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }
        
        .action-row-split {
            display: flex;
            gap: 0.75rem;
            width: 100%;
        }
        
        .btn-full {
            width: 100%;
        }
        
        .btn-split {
            flex: 1;
        }

        .btn-primary {
            background: #f4d35e;
            color: #110a1c;
            border: none;
        }
        .btn-primary:hover {
            background: #e5c144;
        }
        .btn-info {
            background: #3a86ff;
            color: #ffffff;
            border: none;
        }
        .btn-info:hover {
            background: #256be5;
        }
        .btn-secondary {
            background: transparent;
            color: #b3b0c2;
            border: 1px solid #29292e;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: #7c7c8a;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="login-container" id="gate-card">
        <!-- WRAPPER: INITIAL SECURITY LOGIN VIEW -->
        <div id="auth-view">
            <h2>Enter Passcode</h2>
            <input type="password" id="passcode" placeholder="Enter 6-digit code" maxlength="6" autocomplete="off">
            <button onclick="checkCode()">Submit</button>
            <p id="error-message" style="color: #ff5964; display: none;">Incorrect passcode. Try again.</p>
        </div>

        <!-- WRAPPER: REVEALED CONTACT INFORMATION & NAVIGATION -->
        <div id="link-view" style="display: none;">
            <h2 style="color: #f4d35e;">Access Granted</h2>
            <p style="color: #7c7c8a; font-size: 0.95rem; margin-bottom: 1rem;">System Nodes Securely Connected</p>
            
            <div class="reveal-details">
                <p style="color: #7c7c8a; font-size: 0.85rem; margin: 0; text-transform: uppercase; letter-spacing: 1px;">Direct Contact Lines</p>
                <div class="phone-display">(636) 293-7619</div>
            </div>

            <!-- THREE DIRECTION ACTIONS ENGINE GRID -->
            <div class="action-flex-grid">
                <!-- PRIMARY STRAP ACTION: CALL PROTOCOL -->
                <a class="link-btn btn-primary btn-full" href="tel:+16362937619">
                    Call Now 📞
                </a>
                
                <!-- SECONDARY DIVIDED ROW SUBMODULE -->
                <div class="action-row-split">
                    <!-- SMS PROTOCOL TRIGGER -->
                    <a class="link-btn btn-info btn-split" href="sms:+16362937619">
                        Text SMS 💬
                    </a>
                    
                    <!-- LOCAL STORAGE/SERVER SYSTEM TRANSMISSION LOG -->
                    <a class="link-btn btn-secondary btn-split" href="main.html">
                        Open Logs →
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function checkCode() {
            const input = document.getElementById('passcode').value;
            const correctCode = "127312"; 
            const errorMsg = document.getElementById('error-message');
            
            if (input === correctCode) {
                errorMsg.style.display = "none";
                
                // Execute smooth UI crossfade inside the block layout module
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('link-view').style.display = 'block';
                document.getElementById('gate-card').style.borderColor = '#04d361';
            } else {
                errorMsg.style.display = "block";
                document.getElementById('passcode').value = '';
                document.getElementById('passcode').focus();
            }
        }

        // Bind enter keys to the code field for faster hands-free authorization execution
        window.addEventListener('DOMContentLoaded', () => {
            const passcodeField = document.getElementById('passcode');
            if (passcodeField) {
                passcodeField.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        checkCode();
                    }
                });
                passcodeField.focus();
            }
        });
    </script>

</body>
</html>
