

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olihaven</title>
    <link rel="icon" type="image/x-icon" href="./favicon-2.ico">
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Fallback styling framework to keep elements neatly structured */
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .login-container {
            background-color: #202024;
            border: 1px solid #29292e;
            border-radius: 12px;
            padding: 2.5rem;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }
        input[type="password"], input[type="text"], input[type="tel"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid #29292e;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            text-align: center;
            margin-bottom: 1.2rem;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #f4d35e;
        }
        button, .link-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background: #f4d35e;
            color: #110a1c;
            border: none;
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            box-sizing: border-box;
            text-align: center;
        }
        button:hover, .link-btn:hover {
            background: #e5c144;
        }
        .link-btn:active {
            transform: scale(0.98);
        }
        #error-message {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        /* Phone Database Manager Module */
        .database-section {
            background: rgba(0,0,0,0.2);
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 1.2rem;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .section-title {
            color: #7c7c8a;
            font-size: 0.85rem;
            margin: 0 0 1rem 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        .phone-input-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .phone-input-row input {
            margin-bottom: 0;
            font-size: 0.95rem;
            text-align: left;
        }
        .btn-add {
            width: auto;
            padding: 0 1.2rem;
            background: #04d361;
            color: #ffffff;
        }
        .btn-add:hover {
            background: #03b853;
        }
        
        /* Rendered Phone List Items */
        .phone-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
        }
        .phone-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #29292e;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
        }
        .phone-item-info {
            display: flex;
            flex-direction: column;
        }
        .phone-item-name {
            font-size: 0.8rem;
            color: #7c7c8a;
        }
        .phone-item-num {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
        }
        .phone-item-num:hover {
            color: #f4d35e;
        }
        .btn-delete {
            background: transparent;
            color: #ff5964;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0 0.3rem;
        }
        .btn-delete:hover {
            color: #ff3341;
        }
        .empty-state {
            color: #7c7c8a;
            font-size: 0.9rem;
            text-align: center;
            margin: 1rem 0;
            font-style: italic;
        }

        /* SYSTEM TRANSMISSION NAVIGATION FOOTER */
        .footer-nav {
            margin-top: 1rem;
            width: 100%;
        }
        .btn-secondary {
            background: transparent;
            color: #b3b0c2;
            border: 1px solid #29292e;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: #7c7c8a;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="login-container" id="gate-card">
        <!-- WRAPPER: INITIAL SECURITY LOGIN VIEW -->
        <div id="auth-view">
            <h2>Enter Passcode</h2>
            <input type="password" id="passcode" placeholder="Enter 6-digit code" maxlength="6" autocomplete="off">
            <button onclick="checkCode()">Submit</button>
            <p id="error-message" style="color: #ff5964; display: none;">Incorrect passcode. Try again.</p>
        </div>

        <!-- WRAPPER: REVEALED CONTACT INFORMATION & STORAGE DATABASE -->
        <div id="link-view" style="display: none;">
            <h2 style="color: #f4d35e;">Access Granted</h2>
            <p style="color: #7c7c8a; font-size: 0.95rem; margin-bottom: 1rem;">Olihaven Secure Vault Terminal</p>
            
            <!-- PHONE BOOK STORAGE APPLICATION -->
            <div class="database-section">
                <p class="section-title">Saved Node Directories</p>
                
                <!-- Input Interface Matrix -->
                <div class="phone-input-row">
                    <input type="text" id="contact-name" placeholder="Label/Name" style="flex: 1;">
                    <input type="tel" id="contact-number" placeholder="Phone Number" style="flex: 1.3;">
                    <button class="btn-add" onclick="saveContact()">+</button>
                </div>

                <!-- Display Terminal Node List -->
                <ul class="phone-list" id="saved-numbers-list">
                    <!-- Numbers inject dynamically via memory map logic -->
                </ul>
            </div>

            <!-- FOOTER SYSTEM TRANSMISSION LOG LINK -->
            <div class="footer-nav">
                <a class="link-btn btn-secondary" href="main.html">
                    Open Logs →
                </a>
            </div>
        </div>
    </div>

    <script>
        // Check structural system passcode authentication loop
        function checkCode() {
            const input = document.getElementById('passcode').value;
            const correctCode = "127312"; 
            const errorMsg = document.getElementById('error-message');
            
            if (input === correctCode) {
                errorMsg.style.display = "none";
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('link-view').style.display = 'block';
                document.getElementById('gate-card').style.borderColor = '#04d361';
                
                // Mount database data stream layout upon unlocking view panel
                renderContacts();
            } else {
                errorMsg.style.display = "block";
                document.getElementById('passcode').value = '';
                document.getElementById('passcode').focus();
            }
        }

        // DATABASE STORAGE LOGIC PIPELINES
                // Bind physical keyboard enter clicks for convenient submission speeds
        window.addEventListener('DOMContentLoaded', () => {
            const passcodeField = document.getElementById('passcode');
            if (passcodeField) {
                passcodeField.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        checkCode();
                    }
                });
                passcodeField.focus();
            }

            // Also map enter key inside database row configuration fields
            const numField = document.getElementById('contact-number');
            if (numField) {
                numField.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        saveContact();
                    }
                });
            }
        });
    </script>
</body>
</html>
